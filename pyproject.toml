[project]
name = "mcp-project-memory"
version = "0.1.0"
description = "Persistent project memory for AI assistants via MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "pydantic>=2.0",
]

[project.scripts]
mcp-project-memory = "src.adapters.transport.stdio_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
vector = [
    "sqlite-vec>=0.1",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
